spring:
  application:
    name: library-management

  datasource:
    url: jdbc:h2:mem:librarytestdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

